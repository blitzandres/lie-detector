<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Consensus Overlay</title>
  <link rel="stylesheet" href="/static/css/overlay.css" />
</head>
<body>
  <header>Blitz Engine · Live Consensus Overlay · webcam · local-only</header>
  <div class="dashboard">
    <!-- LEFT: camera stage -->
    <div class="stage">
      <video id="cam" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="caption" class="caption" aria-live="polite"></div>
      <div id="stt-notice" class="stt-notice">Transcript via Chrome cloud STT
        <button id="stt-toggle" type="button">disable</button>
      </div>
      <div id="calibration" class="calib" style="display:none"></div>
    </div>
    <!-- RIGHT: signal dashboard -->
    <section class="panel">
      <div class="panel-head">
        <span id="status">CONNECTING</span>
        <button id="toggle">details</button>
      </div>
      <div class="risk-meter"><div id="risk-fill"></div></div>
      <div id="agree">— of 2 families agree</div>
      <div id="message"></div>
      <div class="enneagram-wrap">
        <canvas id="enneagram" width="300" height="300"></canvas>
      </div>
      <div id="panel-body">
        <ul id="voters"></ul>
      </div>
      <div class="verifier">
        <div id="verdict" class="verdict">—</div>
        <div id="convergence" class="convergence">0 cues · 0 channels firing</div>
        <ul id="cue-rows" class="cue-rows"></ul>
        <div class="sensitivity">
          <label for="sens">sensitivity</label>
          <input id="sens" type="range" min="0" max="1" step="0.05" value="0" />
          <span class="sens-warn">↑ raises false alarms</span>
        </div>
        <div id="trust" class="trust">trust: 100% · bells/min: 0</div>
      </div>
      <div class="qa">
        <div class="qa-title">Content engine · Q&amp;A</div>
        <input id="qa-question" class="qa-question" placeholder="Question…"
               value="Where were you last Tuesday evening?" />
        <textarea id="qa-answer" class="qa-answer" rows="2"
                  placeholder="Answer (live transcript fills if blank)…"></textarea>
        <div class="qa-buttons">
          <button id="qa-start" type="button">start answer</button>
          <button id="qa-judge" type="button">judge</button>
          <button id="qa-fill-read" type="button">read</button>
          <button id="qa-fill-true" type="button">TRUE</button>
          <button id="qa-fill-false" type="button">FALSE</button>
        </div>
        <div id="qa-verdict" class="qa-verdict">—</div>
      </div>
    </section>
  </div>
  <div class="timeline-wrap">
    <div class="timeline-title">Cue Mixer · synchrony timeline</div>
    <canvas id="cue-timeline" class="timeline-canvas"></canvas>
  </div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
